name: Check MakerSpace Availability
on:
  schedule:
    - cron: '*/30 * * * *'  # Run every 30 minutes
  workflow_dispatch:  # Allow manual trigger

# Prevents runs from piling up / getting stuck behind each other.
# If a new scheduled run starts while an old one is still going,
# the old one gets cancelled instead of hanging for hours.
concurrency:
  group: makerspace-checker
  cancel-in-progress: true

jobs:
  check-availability:
    runs-on: ubuntu-latest
    # Kills the job automatically if it hangs, instead of letting it
    # sit "in progress" for up to 6 hours (GitHub's default max).
    timeout-minutes: 10

    permissions:
      contents: write  # Allow pushing state file back to repo
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run availability checker
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GOOGLE_CALENDAR_CREDENTIALS: ${{ secrets.GOOGLE_CALENDAR_CREDENTIALS }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: node check-availability.js

      - name: Save screenshot to screenshots folder
        run: |
          mkdir -p screenshots
          mv calendar-page1.png screenshots/calendar-page1.png
      
      - name: Commit state file and screenshot
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add previous-state.json screenshots/calendar-page1.png
          git diff --quiet && git diff --staged --quiet || git commit -m "Update availability state and screenshot [skip ci]"
          git push
